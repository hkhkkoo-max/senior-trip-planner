# ==============================================================================
# Nginx Reverse Proxy Configuration for Senior Trip Planner
# (가비아 도메인 연동 및 SSL/HTTPS, PWA 헤더 최적화 설정)
# ==============================================================================

# 1. HTTP -> HTTPS 자동 리다이렉트 블록 (포트 80)
server {
    listen 80;
    listen [::]:80;
    
    # 구매하신 가비아 도메인명으로 변경해 주세요 (예: your-domain.com www.your-domain.com)
    server_name your-domain.com www.koo72.com;

    # Let's Encrypt Certbot SSL 인증서 발급 챌린지 경로
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 모든 HTTP 요청을 HTTPS로 301 영구 이동
    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS 메인 서비스 블록 (포트 443)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name your-domain.com www.your-domain.com;

    # SSL 인증서 경로 (Let's Encrypt Certbot 연동 시 자동 생성)
    ssl_certificate /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;

    # SSL 보안 프로토콜 및 암호화 알고리즘
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # 보안 헤더
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip 압축 설정
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/json application/javascript application/manifest+json image/svg+xml;

    # 프로젝트 루트 디렉터리
    set $project_root /home/ubuntu/senior-trip-planner;

    # PWA 서비스 워커 및 매니페스트 전용 헤더 설정
    location = /sw.js {
        alias $project_root/static/sw.js;
        add_header Cache-Control "no-cache";
        add_header Service-Worker-Allowed "/";
    }

    location = /manifest.json {
        alias $project_root/static/manifest.json;
        add_header Cache-Control "max-age=86400";
    }

    # 정적 파일 (CSS, JS, Icons) Nginx 직접 서빙 (성능 최적화)
    location /static/ {
        alias $project_root/static/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # Gunicorn 백엔드 리버스 프록시 연동
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 타임아웃 설정 (Gemini AI 호출 대비 60초)
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
