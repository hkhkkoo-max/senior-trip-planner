# ==============================================================================
# Nginx Reverse Proxy Configuration for Senior Trip Planner
# (Cloudflare SSL / 도메인 / 공용 IP 완벽 호환 및 PWA 최적화)
# ==============================================================================

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    
    server_name _;

    # Gzip 압축 설정 (모바일 접속 속도 극대화)
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/json application/javascript application/manifest+json image/svg+xml;

    # 프로젝트 루트 디렉터리
    set $project_root /home/ubuntu/senior-trip-planner;

    # PWA 서비스 워커 및 매니페스트 전용 헤더
    location = /sw.js {
        alias $project_root/static/sw.js;
        add_header Cache-Control "no-cache";
        add_header Service-Worker-Allowed "/";
    }

    location = /manifest.json {
        alias $project_root/static/manifest.json;
        add_header Cache-Control "max-age=86400";
    }

    # 정적 파일 (CSS, JS, Icons) Nginx 직접 서빙
    location /static/ {
        alias $project_root/static/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # Gunicorn Flask 백엔드 연동
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 타임아웃 설정 (AI 생성 대기 60초)
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
