<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="100%">
  <defs>
    <!-- 하늘 그라데이션 -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="45%" stop-color="#bae6fd" />
      <stop offset="85%" stop-color="#fed7aa" />
      <stop offset="100%" stop-color="#fbcfe8" />
    </linearGradient>

    <!-- 따뜻한 태양 그라데이션 -->
    <radialGradient id="sunGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffedd5" />
      <stop offset="60%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.8" />
    </radialGradient>

    <!-- 먼 산 그라데이션 -->
    <linearGradient id="mountGradFar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#c7d2fe" stop-opacity="0.9" />
    </linearGradient>

    <!-- 중간 산 그라데이션 -->
    <linearGradient id="mountGradMid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#93c5fd" stop-opacity="0.95" />
    </linearGradient>

    <!-- 앞쪽 숲/언덕 그라데이션 -->
    <linearGradient id="hillGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="hillGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="hillGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>

    <!-- 도로 그라데이션 -->
    <linearGradient id="roadGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- 그림자 필터 -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- 1. 하늘 배경 -->
  <rect width="800" height="420" rx="28" fill="url(#skyGrad)" />

  <!-- 2. 따뜻한 태양 & 은은한 햇살 -->
  <circle cx="640" cy="110" r="54" fill="url(#sunGrad)" opacity="0.9" />
  <circle cx="640" cy="110" r="85" fill="#fef08a" opacity="0.25" />

  <!-- 구름들 -->
  <!-- 구름 1 -->
  <g fill="#ffffff" opacity="0.85">
    <circle cx="160" cy="80" r="28" />
    <circle cx="195" cy="72" r="38" />
    <circle cx="235" cy="82" r="26" />
    <rect x="160" y="75" width="75" height="32" rx="16" />
  </g>
  <!-- 구름 2 -->
  <g fill="#ffffff" opacity="0.65">
    <circle cx="440" cy="95" r="20" />
    <circle cx="468" cy="88" r="26" />
    <circle cx="496" cy="96" r="18" />
    <rect x="440" y="92" width="56" height="22" rx="11" />
  </g>
  <!-- 구름 3 -->
  <g fill="#ffffff" opacity="0.5">
    <circle cx="60" cy="120" r="18" />
    <circle cx="85" cy="114" r="24" />
    <circle cx="110" cy="122" r="16" />
    <rect x="60" y="118" width="50" height="20" rx="10" />
  </g>

  <!-- 새들 (V자 비행) -->
  <path d="M 330,70 Q 338,62 346,70 Q 354,62 362,70" fill="none" stroke="#475569" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />
  <path d="M 365,85 Q 371,78 377,85 Q 383,78 389,85" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="round" opacity="0.5" />
  <path d="M 315,90 Q 320,84 325,90 Q 330,84 335,90" fill="none" stroke="#475569" stroke-width="1.8" stroke-linecap="round" opacity="0.5" />

  <!-- 3. 먼 산맥 (수려한 한국의 산세) -->
  <path d="M -20,240 Q 110,130 240,210 T 520,180 T 820,220 L 820,420 L -20,420 Z" fill="url(#mountGradFar)" />
  <path d="M 120,260 Q 280,150 440,230 T 760,190 T 840,230 L 840,420 L 120,420 Z" fill="url(#mountGradMid)" />

  <!-- 4. 호수 / 강물 (잔잔한 물결) -->
  <path d="M -20,270 Q 180,240 380,270 T 820,260 L 820,330 L -20,330 Z" fill="#38bdf8" opacity="0.4" />
  <path d="M -20,285 Q 220,265 460,285 T 820,275 L 820,330 L -20,330 Z" fill="#67e8f9" opacity="0.5" />

  <!-- 5. 싱그러운 초록 언덕들 -->
  <path d="M -20,310 Q 160,250 380,310 T 820,290 L 820,420 L -20,420 Z" fill="url(#hillGrad1)" />
  <path d="M 220,330 Q 520,270 820,330 L 820,420 L 220,420 Z" fill="url(#hillGrad2)" />
  <path d="M -20,345 Q 240,310 520,360 T 820,340 L 820,420 L -20,420 Z" fill="url(#hillGrad3)" />

  <!-- 언덕 위 나무들 -->
  <g fill="#047857">
    <!-- 나무 1 -->
    <path d="M 90,290 Q 75,270 90,250 Q 105,270 90,290 Z" />
    <path d="M 110,295 Q 98,278 110,260 Q 122,278 110,295 Z" />
    <!-- 나무 2 -->
    <path d="M 680,285 Q 665,260 680,238 Q 695,260 680,285 Z" fill="#065f46" />
    <path d="M 705,290 Q 692,270 705,250 Q 718,270 705,290 Z" fill="#047857" />
    <path d="M 730,298 Q 720,280 730,265 Q 740,280 730,298 Z" fill="#065f46" />
  </g>

  <!-- 6. 낭만적인 드라이브 도로 -->
  <path d="M -20,420 C 180,370 280,320 480,335 C 640,348 720,380 820,390 L 820,430 L -20,430 Z" fill="url(#roadGrad)" />
  
  <!-- 도로 중앙 황색 점선 -->
  <path d="M -10,418 C 190,368 285,322 480,337 C 640,350 720,381 815,391" fill="none" stroke="#facc15" stroke-width="4" stroke-dasharray="24,18" stroke-linecap="round" opacity="0.9" />
  <!-- 도로 외곽 흰색 실선 -->
  <path d="M -15,404 C 180,356 275,312 475,327 C 635,340 715,372 815,382" fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.6" />

  <!-- 7. 여행을 떠나는 예쁜 블루 SUV 자동차 -->
  <g transform="translate(390, 260) scale(0.95)" filter="url(#softShadow)">
    <!-- 자동차 그림자 -->
    <ellipse cx="90" cy="98" rx="85" ry="12" fill="#0f172a" opacity="0.35" />

    <!-- 차체 하단 바디 -->
    <path d="M 12,68 C 12,58 20,52 32,52 L 55,52 L 78,32 C 84,27 92,24 102,24 L 142,24 C 150,24 158,28 163,35 L 175,52 L 182,56 C 190,60 194,68 194,76 L 194,82 C 194,86 190,90 185,90 L 170,90 C 170,80 160,72 148,72 C 136,72 126,80 126,90 L 58,90 C 58,80 48,72 36,72 C 24,72 14,80 14,90 L 8,90 C 4,90 0,86 0,82 L 0,76 C 0,70 5,68 12,68 Z" fill="#2563eb" />

    <!-- 차체 상단 하이라이트 -->
    <path d="M 32,54 L 55,54 L 78,34 C 84,29 92,26 102,26 L 142,26 C 150,26 158,30 163,37 L 175,54 L 145,54 L 102,30 L 78,35 Z" fill="#60a5fa" opacity="0.6" />

    <!-- 유리창 (앞유리, 뒷유리, 측면유리) -->
    <path d="M 60,50 L 80,33 C 84,30 90,28 96,28 L 118,28 L 118,50 Z" fill="#e0f2fe" opacity="0.95" />
    <path d="M 124,28 L 142,28 C 147,28 153,31 156,36 L 168,50 L 124,50 Z" fill="#e0f2fe" opacity="0.95" />
    <line x1="121" y1="28" x2="121" y2="50" stroke="#1d4ed8" stroke-width="4" />

    <!-- 헤드라이트 & 테일램프 -->
    <path d="M 188,64 L 194,66 L 194,74 L 186,74 Z" fill="#fef08a" />
    <circle cx="191" cy="69" r="4" fill="#facc15" />
    <!-- 테일램프 -->
    <rect x="0" y="66" width="6" height="10" rx="2" fill="#ef4444" />

    <!-- 도어 핸들 & 사이드 가니쉬 -->
    <rect x="75" y="58" width="14" height="3" rx="1.5" fill="#1e3a8a" />
    <rect x="130" y="58" width="14" height="3" rx="1.5" fill="#1e3a8a" />
    <rect x="58" y="78" width="68" height="4" rx="2" fill="#1d4ed8" opacity="0.8" />

    <!-- 바퀴 (앞/뒤 휠 & 타이어) -->
    <!-- 앞바퀴 -->
    <g transform="translate(148, 90)">
      <circle cx="0" cy="0" r="18" fill="#1e293b" />
      <circle cx="0" cy="0" r="12" fill="#94a3b8" />
      <circle cx="0" cy="0" r="6" fill="#38bdf8" />
      <circle cx="0" cy="0" r="2.5" fill="#ffffff" />
    </g>
    <!-- 뒷바퀴 -->
    <g transform="translate(36, 90)">
      <circle cx="0" cy="0" r="18" fill="#1e293b" />
      <circle cx="0" cy="0" r="12" fill="#94a3b8" />
      <circle cx="0" cy="0" r="6" fill="#38bdf8" />
      <circle cx="0" cy="0" r="2.5" fill="#ffffff" />
    </g>

    <!-- 루프탑 여행 캐리어 가방 & 장비 (여행 무드 극대화) -->
    <rect x="85" y="16" width="60" height="8" rx="4" fill="#0f172a" />
    <rect x="92" y="6" width="46" height="11" rx="5" fill="#f97316" />
    <rect x="96" y="8" width="38" height="2" fill="#fdba74" />
    <!-- 루프랙 지지대 -->
    <line x1="94" y1="16" x2="94" y2="24" stroke="#0f172a" stroke-width="3" />
    <line x1="136" y1="16" x2="136" y2="24" stroke="#0f172a" stroke-width="3" />

    <!-- 친환경 EV 초록 뱃지 아이콘 -->
    <circle cx="170" cy="74" r="8" fill="#10b981" />
    <path d="M 171,69 L 167,75 L 170,75 L 169,79 L 173,73 L 170,73 Z" fill="#ffffff" />
  </g>

  <!-- 가로수 및 꽃들 (길가 분위기) -->
  <g transform="translate(680, 310)">
    <circle cx="20" cy="0" r="14" fill="#fb7185" opacity="0.85" />
    <circle cx="45" cy="10" r="18" fill="#fda4af" opacity="0.85" />
    <circle cx="32" cy="18" r="12" fill="#f43f5e" opacity="0.75" />
  </g>

  <!-- 부드러운 하단 비네팅 페이드 -->
  <rect x="0" y="360" width="800" height="60" rx="28" fill="url(#skyGrad)" opacity="0.0" />
</svg>
