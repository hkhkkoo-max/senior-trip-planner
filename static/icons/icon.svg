<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- 배경 스퀘어클 -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  
  <!-- 내부 원형 배경 -->
  <g filter="url(#shadow)">
    <circle cx="256" cy="256" r="180" fill="#ffffff" opacity="0.96"/>
    
    <!-- 자동차 일러스트 -->
    <g transform="translate(136, 150) scale(0.95)">
      <!-- 차체 -->
      <path d="M40 130 C40 110, 65 80, 95 65 L155 35 C175 25, 205 25, 225 35 L285 65 C315 80, 340 110, 340 130 L345 170 C345 180, 335 190, 325 190 L55 190 C45 190, 35 180, 35 170 Z" fill="#2563eb"/>
      
      <!-- 앞유리창 -->
      <path d="M100 75 L155 45 C170 38, 210 38, 225 45 L280 75 C295 85, 305 105, 305 120 L75 120 C75 105, 85 85, 100 75 Z" fill="#e0f2fe"/>
      
      <!-- 헤드라이트 -->
      <circle cx="75" cy="155" r="16" fill="#facc15" />
      <circle cx="305" cy="155" r="16" fill="#facc15" />
      
      <!-- 범퍼 -->
      <rect x="130" y="145" width="120" height="22" rx="10" fill="#1e293b" opacity="0.8"/>
      
      <!-- 번호판 -->
      <rect x="160" y="172" width="60" height="12" rx="4" fill="#ffffff"/>
      <text x="190" y="181" font-size="8" font-family="sans-serif" font-weight="bold" fill="#2563eb" text-anchor="middle">분당출발</text>
      
      <!-- 바퀴 -->
      <rect x="45" y="185" width="45" height="25" rx="10" fill="#334155"/>
      <rect x="290" y="185" width="45" height="25" rx="10" fill="#334155"/>
    </g>
    
    <!-- 전기차 번개 & 나뭇잎 아이콘 -->
    <g transform="translate(230, 95) scale(0.9)">
      <circle cx="28" cy="28" r="28" fill="#10b981"/>
      <path d="M30 8 L16 30 L26 30 L22 48 L38 24 L28 24 Z" fill="#ffffff"/>
    </g>
  </g>
  
  <!-- 텍스트 라벨 -->
  <text x="256" y="425" font-size="34" font-family="'Pretendard', sans-serif" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1">당일치기 여행</text>
</svg>
