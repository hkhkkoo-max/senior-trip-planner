name: Deploy to Oracle Cloud

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Continuous Deployment
    runs-on: ubuntu-latest

    steps:
      - name: SSH to Oracle Cloud and Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USERNAME }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          port: ${{ secrets.ORACLE_PORT || 22 }}
          script_stop: true
          script: |
            echo "=========================================="
            echo "🚀 [CI/CD] 배포를 시작합니다: $(date)"
            echo "=========================================="

            # 1. 프로젝트 디렉터리 이동
            cd /home/ubuntu/senior-trip-planner || exit 1

            # 2. 최신 코드 가져오기
            echo "📥 1. Git pull 최신 코드 동기화..."
            git pull origin main

            # 3. 가상환경 활성화 및 의존성 패키지 설치
            echo "📦 2. 파이썬 패키지 업데이트..."
            source venv/bin/activate
            pip install --upgrade pip
            pip install -r requirements.txt

            # 4. Gunicorn 데몬 재시작 (무중단 리로드)
            echo "🔄 3. Gunicorn 서비스 재시작..."
            sudo systemctl daemon-reload
            sudo systemctl restart senior-trip.service

            # 5. 서비스 정상 구동 여부 확인
            echo "🔍 4. 배포 상태 확인..."
            sudo systemctl is-active --quiet senior-trip.service && echo "✅ 서비스 정상 실행 중!" || { echo "❌ 서비스 실행 실패!"; exit 1; }

            echo "=========================================="
            echo "🎉 [CI/CD] 배포가 성공적으로 완료되었습니다!"
            echo "=========================================="
